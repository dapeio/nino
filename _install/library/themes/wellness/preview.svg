<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Wellness theme preview">
	<title>Wellness</title>
	<rect width="600" height="400" fill="#f4f7f3"/>

	<!-- header -->
	<rect x="24" y="20" width="86" height="12" rx="3" fill="#4a7f6d"/>
	<g fill="#6a7a71" opacity=".75">
		<rect x="404" y="22" width="42" height="8" rx="3"/>
		<rect x="458" y="22" width="42" height="8" rx="3"/>
		<rect x="512" y="22" width="42" height="8" rx="3"/>
	</g>
	<rect x="24" y="48" width="552" height="1" fill="#dbe4dc"/>

	<!-- hero -->
	<text x="24" y="112" font-family="system-ui, sans-serif" font-size="40" font-weight="700" fill="#2c4a40">Wellness</text>
	<text x="24" y="140" font-family="Georgia, serif" font-size="15" fill="#6a7a71">A starting look for the whole site.</text>
	<rect x="24" y="160" width="132" height="34" rx="9" fill="#4a7f6d"/>
	<text x="90" y="182" font-family="Georgia, serif" font-size="13" font-weight="600" fill="#fbfdfa" text-anchor="middle">Get in touch</text>
	<rect x="168" y="160" width="112" height="34" rx="9" fill="none" stroke="#d9a441" stroke-width="1.5"/>
	<text x="224" y="182" font-family="Georgia, serif" font-size="13" font-weight="600" fill="#d9a441" text-anchor="middle">Learn more</text>

	<!-- cards -->
	<rect x="24" y="222" width="168" height="104" rx="12.5" fill="#e7efe7"/>
	<rect x="216" y="222" width="168" height="104" rx="12.5" fill="#e7efe7"/>
	<rect x="408" y="222" width="168" height="104" rx="12.5" fill="#e7efe7"/>
	<g fill="#24352d">
		<rect x="44" y="246" width="76" height="10" rx="3"/>
		<rect x="236" y="246" width="76" height="10" rx="3"/>
		<rect x="428" y="246" width="76" height="10" rx="3"/>
	</g>
	<g fill="#24352d" opacity=".45">
		<rect x="44" y="270" width="128" height="7" rx="3"/>
