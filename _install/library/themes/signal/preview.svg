<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Signal theme preview">
	<title>Signal</title>
	<rect width="600" height="400" fill="#ffffff"/>

	<!-- header (v5, strip) -->
