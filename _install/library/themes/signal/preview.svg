	<rect x="224" y="292" width="112" height="6" rx="1.6" fill="#100c0c" opacity=".45"/>
	<rect x="392" y="244" width="168" height="68" rx="1.6" fill="#100c0c" opacity=".08"/>
	<rect x="408" y="260" width="83" height="9" rx="1.6" fill="#100c0c" opacity=".85"/>
