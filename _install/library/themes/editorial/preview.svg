<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Editorial theme preview">
	<title>Editorial</title>
	<rect width="600" height="400" fill="#ffffff"/>

	<!-- header (v2, bar) -->
	<rect x="24" y="20" width="86" height="12" rx="0.8" fill="#215d63"/>
	<g fill="#0b0e0e" opacity=".7">
		<rect x="404" y="22" width="42" height="8" rx="0.8"/>
		<rect x="458" y="22" width="42" height="8" rx="0.8"/>
