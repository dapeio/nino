	<text x="24" y="118" font-family="Optima, Candara, system-ui, sans-serif" font-size="40" font-weight="600" letter-spacing="-0.5" fill="#0b0e0e">Editorial</text>
	<text x="24" y="146" font-family="Georgia, serif" font-size="15" fill="#757777">A starting look for the whole site.</text>
	<rect x="24" y="166" width="132" height="34" rx="0.8" fill="#455b5e"/>
	<text x="90" y="188" font-family="Georgia, serif" font-size="13" font-weight="600" fill="#fcfcfc" text-anchor="middle">Get in touch</text>
	<rect x="168" y="166" width="112" height="34" rx="0.8" fill="none" stroke="#455b5e" stroke-width="1.5"/>
	<text x="224" y="188" font-family="Georgia, serif" font-size="13" font-weight="600" fill="#455b5e" text-anchor="middle">Learn more</text>

	<!-- alternating section -->
	<rect x="0" y="224" width="600" height="108" fill="#f0f4f5"/>
	<rect x="24" y="244" width="168" height="68" rx="0.8" fill="#0b0e0e" opacity=".08"/>
	<rect x="40" y="260" width="102" height="9" rx="0.8" fill="#0b0e0e" opacity=".85"/>
	<rect x="40" y="280" width="136" height="6" rx="0.8" fill="#0b0e0e" opacity=".45"/>
	<rect x="40" y="292" width="112" height="6" rx="0.8" fill="#0b0e0e" opacity=".45"/>
	<rect x="208" y="244" width="168" height="68" rx="0.8" fill="#0b0e0e" opacity=".08"/>
	<rect x="224" y="260" width="92" height="9" rx="0.8" fill="#0b0e0e" opacity=".85"/>
	<rect x="224" y="280" width="136" height="6" rx="0.8" fill="#0b0e0e" opacity=".45"/>
	<rect x="224" y="292" width="112" height="6" rx="0.8" fill="#0b0e0e" opacity=".45"/>
	<rect x="392" y="244" width="168" height="68" rx="0.8" fill="#0b0e0e" opacity=".08"/>
	<rect x="408" y="260" width="83" height="9" rx="0.8" fill="#0b0e0e" opacity=".85"/>
	<rect x="408" y="280" width="136" height="6" rx="0.8" fill="#0b0e0e" opacity=".45"/>
	<rect x="408" y="292" width="112" height="6" rx="0.8" fill="#0b0e0e" opacity=".45"/>

	<!-- footer (v3) -->
	<rect x="0" y="332" width="600" height="68" fill="#2b2f2f"/>
	<rect x="24" y="352" width="70" height="10" rx="0.8" fill="#949595"/>
	<g fill="#7b7d7d" opacity=".8">
		<rect x="404" y="354" width="42" height="6" rx="0.8"/>
		<rect x="458" y="354" width="42" height="6" rx="0.8"/>
		<rect x="512" y="354" width="42" height="6" rx="0.8"/>
