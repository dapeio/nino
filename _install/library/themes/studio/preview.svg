<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Studio theme preview">
	<title>Studio</title>
	<rect width="600" height="400" fill="#ffffff"/>

	<!-- header (v4, bar) -->
	<rect x="24" y="20" width="86" height="12" rx="0.8" fill="#f24405"/>
	<g fill="#100c0b" opacity=".7">
		<rect x="404" y="22" width="42" height="8" rx="0.8"/>
		<rect x="458" y="22" width="42" height="8" rx="0.8"/>
		<rect x="512" y="22" width="42" height="8" rx="0.8"/>
	</g>
	<rect x="24" y="48" width="552" height="1" fill="#969494" opacity=".55"/>

	<!-- hero -->
	<text x="24" y="118" font-family="Haettenschweiler, Impact, system-ui, sans-serif" font-size="40" font-weight="900" fill="#100c0b">STUDIO</text>
	<text x="24" y="146" font-family="system-ui, sans-serif" font-size="15" fill="#797676">A starting look for the whole site.</text>
	<rect x="24" y="166" width="132" height="34" rx="0.8" fill="#a12e09"/>
	<text x="90" y="188" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#fcfcfc" text-anchor="middle">Get in touch</text>
	<rect x="168" y="166" width="112" height="34" rx="0.8" fill="none" stroke="#a12e09" stroke-width="1.5"/>
	<text x="224" y="188" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#a12e09" text-anchor="middle">Learn more</text>

	<!-- alternating section -->
	<rect x="0" y="224" width="600" height="108" fill="#16100e"/>
	<rect x="24" y="244" width="168" height="68" rx="0.8" fill="#fcfcfc" opacity=".08"/>
	<rect x="40" y="260" width="102" height="9" rx="0.8" fill="#fcfcfc" opacity=".85"/>
	<rect x="40" y="280" width="136" height="6" rx="0.8" fill="#fcfcfc" opacity=".45"/>
	<rect x="40" y="292" width="112" height="6" rx="0.8" fill="#fcfcfc" opacity=".45"/>
	<rect x="208" y="244" width="168" height="68" rx="0.8" fill="#fcfcfc" opacity=".08"/>
	<rect x="224" y="260" width="92" height="9" rx="0.8" fill="#fcfcfc" opacity=".85"/>
	<rect x="224" y="280" width="136" height="6" rx="0.8" fill="#fcfcfc" opacity=".45"/>
	<rect x="224" y="292" width="112" height="6" rx="0.8" fill="#fcfcfc" opacity=".45"/>
	<rect x="392" y="244" width="168" height="68" rx="0.8" fill="#fcfcfc" opacity=".08"/>
	<rect x="408" y="260" width="83" height="9" rx="0.8" fill="#fcfcfc" opacity=".85"/>
	<rect x="408" y="280" width="136" height="6" rx="0.8" fill="#fcfcfc" opacity=".45"/>
	<rect x="408" y="292" width="112" height="6" rx="0.8" fill="#fcfcfc" opacity=".45"/>

	<!-- footer (v4) -->
	<rect x="0" y="332" width="600" height="68" fill="#16100e"/>
	<rect x="24" y="352" width="70" height="10" rx="0.8" fill="#7e7c7b"/>
	<g fill="#7e7c7b" opacity=".8">
		<rect x="404" y="354" width="42" height="6" rx="0.8"/>
		<rect x="458" y="354" width="42" height="6" rx="0.8"/>
		<rect x="512" y="354" width="42" height="6" rx="0.8"/>
	</g>
	<rect x="24" y="378" width="180" height="5" rx="0.8" fill="#7e7c7b" opacity=".6"/>
</svg>
