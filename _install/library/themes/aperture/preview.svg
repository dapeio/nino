<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Aperture theme preview">
	<title>Aperture</title>
	<defs>
		<linearGradient id="aperture-plate" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#c9ced2"/>
			<stop offset="1" stop-color="#9aa1a6"/>
		</linearGradient>
	</defs>
	<rect width="600" height="400" fill="#f2f3f4"/>

	<!-- header (v4, wordmark and a burger, nothing else) -->
	<rect x="24" y="20" width="92" height="11" rx="1" fill="#0d0d0e" opacity=".9"/>
	<g fill="#0d0d0e" opacity=".8">
		<rect x="546" y="19" width="30" height="3"/>
		<rect x="546" y="26" width="30" height="3"/>
		<rect x="546" y="33" width="30" height="3"/>
	</g>

	<!-- the picture is the page -->
	<rect x="24" y="58" width="552" height="164" fill="url(#aperture-plate)"/>
	<circle cx="452" cy="104" r="30" fill="#ffffff" opacity=".22"/>
	<path d="M24 222l128-72 74 44 96-72 254 100v0H24z" fill="#ffffff" opacity=".18"/>

	<!-- caption: small, tracked, upper case -->
	<text x="24" y="244" font-family="Inter, system-ui, sans-serif" font-size="10" letter-spacing="1.6" fill="#6f6f70">NORDLICHT — REGENSBURG, 2026</text>
	<text x="24" y="278" font-family="Jost, Futura, system-ui, sans-serif" font-size="34" font-weight="300" fill="#0d0d0e">Aperture</text>

	<!-- a row of plates, the gallery this theme is built around -->
	<rect x="24" y="298" width="176" height="70" fill="#ffffff"/>
	<rect x="30" y="304" width="164" height="58" fill="url(#aperture-plate)"/>
	<rect x="212" y="298" width="176" height="70" fill="#ffffff"/>
	<rect x="218" y="304" width="164" height="58" fill="url(#aperture-plate)" opacity=".85"/>
	<rect x="400" y="298" width="176" height="70" fill="#ffffff"/>
	<rect x="406" y="304" width="164" height="58" fill="url(#aperture-plate)" opacity=".7"/>

	<!-- footer (v1, one quiet line) -->
	<rect x="0" y="376" width="600" height="24" fill="#111212"/>
	<rect x="24" y="385" width="96" height="6" rx="3" fill="#7c7c7d"/>
	<g fill="#7c7c7d" opacity=".8">
		<rect x="446" y="385" width="34" height="6" rx="3"/>
		<rect x="490" y="385" width="34" height="6" rx="3"/>
		<rect x="534" y="385" width="42" height="6" rx="3"/>
	</g>
</svg>
