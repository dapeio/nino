<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Surface theme preview">
	<title>Surface</title>
	<defs>
		<linearGradient id="surface-alt" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#f9f8fc"/>
			<stop offset="1" stop-color="#f3f2fa"/>
		</linearGradient>
		<linearGradient id="surface-brand" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#8570c4"/>
			<stop offset=".55" stop-color="#7d67bd"/>
			<stop offset="1" stop-color="#6f5aab"/>
		</linearGradient>
	</defs>
	<rect width="600" height="400" fill="#ffffff"/>

	<!-- header (v3, floating card with elevation) -->
	<rect x="18" y="13" width="564" height="36" rx="12" fill="#0d0d10" opacity=".10"/>
	<rect x="16" y="10" width="568" height="36" rx="12" fill="#f0edff"/>
	<rect x="24" y="20" width="86" height="12" rx="6" fill="#7d67bd"/>
	<rect x="398" y="17" width="56" height="22" rx="11" fill="#7d67bd"/>
	<rect x="410" y="24" width="32" height="8" rx="4" fill="#fcfcfc"/>
	<g fill="#0d0d10" opacity=".7">
		<rect x="466" y="24" width="42" height="8" rx="4"/>
		<rect x="520" y="24" width="42" height="8" rx="4"/>
	</g>

	<!-- hero -->
	<text x="24" y="120" font-family="Outfit, Futura, system-ui, sans-serif" font-size="42" font-weight="500" fill="#0d0d10">Surface</text>
	<text x="24" y="148" font-family="Roboto, system-ui, sans-serif" font-size="15" fill="#777679">Large areas, wide margins, one soft light.</text>
	<rect x="24" y="168" width="140" height="34" rx="17" fill="url(#surface-brand)"/>
	<text x="94" y="190" font-family="Roboto, system-ui, sans-serif" font-size="13" font-weight="500" fill="#fcfcfc" text-anchor="middle">Get started</text>
	<rect x="176" y="168" width="118" height="34" rx="17" fill="none" stroke="#7c6daf" stroke-width="1.5"/>
	<text x="235" y="190" font-family="Roboto, system-ui, sans-serif" font-size="13" font-weight="500" fill="#7c6daf" text-anchor="middle">Learn more</text>

	<!-- alternating section, cards lifted off the tone instead of outlined -->
	<rect x="0" y="224" width="600" height="108" fill="url(#surface-alt)"/>
	<g fill="#0d0d10" opacity=".12">
		<rect x="26" y="248" width="168" height="68" rx="12"/>
		<rect x="210" y="248" width="168" height="68" rx="12"/>
		<rect x="394" y="248" width="168" height="68" rx="12"/>
	</g>
	<g fill="#ffffff">
		<rect x="24" y="244" width="168" height="68" rx="12"/>
		<rect x="208" y="244" width="168" height="68" rx="12"/>
		<rect x="392" y="244" width="168" height="68" rx="12"/>
	</g>
	<g fill="#0d0d10">
		<rect x="40" y="260" width="102" height="9" rx="4" opacity=".85"/>
		<rect x="40" y="280" width="136" height="6" rx="3" opacity=".45"/>
		<rect x="40" y="292" width="112" height="6" rx="3" opacity=".45"/>
		<rect x="224" y="260" width="92" height="9" rx="4" opacity=".85"/>
		<rect x="224" y="280" width="136" height="6" rx="3" opacity=".45"/>
		<rect x="224" y="292" width="112" height="6" rx="3" opacity=".45"/>
		<rect x="408" y="260" width="83" height="9" rx="4" opacity=".85"/>
		<rect x="408" y="280" width="136" height="6" rx="3" opacity=".45"/>
		<rect x="408" y="292" width="112" height="6" rx="3" opacity=".45"/>
	</g>

	<!-- footer (v7, brand band) -->
	<rect x="0" y="332" width="600" height="68" fill="url(#surface-brand)"/>
	<rect x="24" y="348" width="64" height="7" rx="3" fill="#fcfcfc" opacity=".75"/>
	<rect x="24" y="364" width="236" height="12" rx="6" fill="#fcfcfc" opacity=".95"/>
	<g fill="#fcfcfc" opacity=".8">
		<rect x="404" y="352" width="42" height="6" rx="3"/>
		<rect x="404" y="368" width="86" height="6" rx="3"/>
		<rect x="404" y="382" width="64" height="6" rx="3"/>
	</g>
</svg>
