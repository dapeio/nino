<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Solid theme preview">
	<title>Solid</title>
	<rect width="600" height="400" fill="#f2f1ec"/>

	<!-- header -->
	<rect x="24" y="20" width="86" height="12" rx="3" fill="#ffd400"/>
	<g fill="#4a4a45" opacity=".75">
		<rect x="404" y="22" width="42" height="8" rx="3"/>
		<rect x="458" y="22" width="42" height="8" rx="3"/>
		<rect x="512" y="22" width="42" height="8" rx="3"/>
	</g>
	<rect x="24" y="48" width="552" height="1" fill="#191919"/>

	<!-- hero -->
	<text x="24" y="112" font-family="system-ui, sans-serif" font-size="40" font-weight="700" fill="#000000">Solid</text>
	<text x="24" y="140" font-family="system-ui, sans-serif" font-size="15" fill="#4a4a45">A starting look for the whole site.</text>
	<rect x="24" y="160" width="132" height="34" rx="0" fill="#ffd400"/>
	<text x="90" y="182" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#111111" text-anchor="middle">Get in touch</text>
	<rect x="168" y="160" width="112" height="34" rx="0" fill="none" stroke="#e34a19" stroke-width="1.5"/>
	<text x="224" y="182" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e34a19" text-anchor="middle">Learn more</text>

	<!-- cards -->
	<rect x="24" y="222" width="168" height="104" rx="0" fill="#e4e2da"/>
	<rect x="216" y="222" width="168" height="104" rx="0" fill="#e4e2da"/>
	<rect x="408" y="222" width="168" height="104" rx="0" fill="#e4e2da"/>
	<g fill="#111111">
		<rect x="44" y="246" width="76" height="10" rx="3"/>
		<rect x="236" y="246" width="76" height="10" rx="3"/>
		<rect x="428" y="246" width="76" height="10" rx="3"/>
	</g>
	<g fill="#111111" opacity=".45">
		<rect x="44" y="270" width="128" height="7" rx="3"/>
