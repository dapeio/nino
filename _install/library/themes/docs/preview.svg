<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Docs theme preview">
	<title>Docs</title>
	<rect width="600" height="400" fill="#ffffff"/>

	<!-- header (v1, bar) -->
	<rect x="24" y="20" width="86" height="12" rx="0.8" fill="#2563eb"/>
	<g fill="#0c0d10" opacity=".7">
		<rect x="404" y="22" width="42" height="8" rx="0.8"/>
		<rect x="458" y="22" width="42" height="8" rx="0.8"/>
		<rect x="512" y="22" width="42" height="8" rx="0.8"/>
	</g>
	<rect x="24" y="48" width="552" height="1" fill="#949596" opacity=".55"/>

	<!-- hero -->
	<text x="24" y="118" font-family="system-ui, sans-serif" font-size="40" font-weight="700" fill="#0c0d10">Docs</text>
	<text x="24" y="146" font-family="system-ui, sans-serif" font-size="15" fill="#757679">A starting look for the whole site.</text>
	<rect x="24" y="166" width="132" height="34" rx="0.8" fill="#3b568e"/>
	<text x="90" y="188" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#fcfcfc" text-anchor="middle">Get in touch</text>
	<rect x="168" y="166" width="112" height="34" rx="0.8" fill="none" stroke="#3b568e" stroke-width="1.5"/>
	<text x="224" y="188" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#3b568e" text-anchor="middle">Learn more</text>

	<!-- alternating section -->
	<rect x="0" y="224" width="600" height="108" fill="#e9f1ff"/>
	<rect x="24" y="244" width="168" height="68" rx="0.8" fill="#0c0d10" opacity=".08"/>
	<rect x="40" y="260" width="102" height="9" rx="0.8" fill="#0c0d10" opacity=".85"/>
	<rect x="40" y="280" width="136" height="6" rx="0.8" fill="#0c0d10" opacity=".45"/>
	<rect x="40" y="292" width="112" height="6" rx="0.8" fill="#0c0d10" opacity=".45"/>
	<rect x="208" y="244" width="168" height="68" rx="0.8" fill="#0c0d10" opacity=".08"/>
	<rect x="224" y="260" width="92" height="9" rx="0.8" fill="#0c0d10" opacity=".85"/>
	<rect x="224" y="280" width="136" height="6" rx="0.8" fill="#0c0d10" opacity=".45"/>
	<rect x="224" y="292" width="112" height="6" rx="0.8" fill="#0c0d10" opacity=".45"/>
	<rect x="392" y="244" width="168" height="68" rx="0.8" fill="#0c0d10" opacity=".08"/>
	<rect x="408" y="260" width="83" height="9" rx="0.8" fill="#0c0d10" opacity=".85"/>
	<rect x="408" y="280" width="136" height="6" rx="0.8" fill="#0c0d10" opacity=".45"/>
	<rect x="408" y="292" width="112" height="6" rx="0.8" fill="#0c0d10" opacity=".45"/>

	<!-- footer (v2) -->
	<rect x="0" y="332" width="600" height="68" fill="#eff4fc"/>
	<rect x="24" y="352" width="70" height="10" rx="0.8" fill="#6e7072"/>
	<g fill="#6e7072" opacity=".8">
		<rect x="404" y="354" width="42" height="6" rx="0.8"/>
		<rect x="458" y="354" width="42" height="6" rx="0.8"/>
		<rect x="512" y="354" width="42" height="6" rx="0.8"/>
	</g>
	<rect x="24" y="378" width="180" height="5" rx="0.8" fill="#6e7072" opacity=".6"/>
