name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: phpstan:2.2.13

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint all PHP files
        run: find . -name "*.php" -not -path "./.git/*" -print0 | xargs -0 -n1 php -l

      - name: Lint all JS files
        run: find . -name "*.js" -not -path "./.git/*" -print0 | xargs -0 -n1 node --check

      # app/ and features/ hold nothing but their .htaccess in a checkout, and
      # git keeps no empty directory: without the file there is no directory,
      # and PHPStan - phpstan.neon analyses both - stops with "Path ... does
      # not exist" before kernel-smoke.php gets to name what is missing
      - name: Check the directories a checkout ships
        run: for dir in app features; do [ -f "$dir/.htaccess" ] || { echo "::error file=$dir/.htaccess::$dir/.htaccess is missing - it is what keeps $dir/ in a checkout and what denies it to a browser"; exit 1; }; done

      # Static analysis - phpstan.neon holds level and paths, the baseline
      # next to it the findings that were open when the check arrived, so
      # only something new fails here
      - name: Analyse PHP with PHPStan
        run: phpstan analyse --no-progress --memory-limit=1G

      # Undefined names, unused code, == where === was meant: what
      # `node --check` cannot see. The version is pinned here and nowhere
      # else - there is no package.json, ESLint is a check and not a
      # dependency of the product
      - name: Analyse JS with ESLint
        run: npx --yes eslint@9.39.0 .

      - name: Run kernel smoke tests
        run: php tests/kernel-smoke.php

      - name: Run features smoke tests
        run: php tests/features-smoke.php

      - name: Run catalogue smoke tests
        run: php tests/catalogue-smoke.php

      # A feature's own tests travel with it - features/<Name>/tests/ - and
      # run against this checkout (see tests/harness.php). A checkout ships
      # no feature of its own, so the loop has to survive an empty glob
      - name: Run every feature's own smoke tests
        run: for test in features/*/tests/*-smoke.php; do [ -e "$test" ] || continue; php "$test" || exit 1; done

      - name: Run workbench shell and content panel smoke tests
        run: php tests/admin-smoke.php

      - name: Run workbench structure and system panel smoke tests
        run: php tests/admin-system-smoke.php

      - name: Run install wizard smoke tests
        run: php tests/install-smoke.php

      # The grammar of a text key and everything shipped to it: the units'
      # texts, the keys the templates read, the key literals in the code, and
      # no old form left anywhere
      - name: Run text key smoke tests
        run: php tests/keys-smoke.php

      # The Legal module: the imprint and the privacy policy as elements,
      # the wizard's unit, the routes per language, the placeholders, the
      # sections a feature's unit adds and the tombstone of a deleted one
      - name: Run legal module smoke tests
        run: php tests/legal-smoke.php

      - name: Run frontend smoke tests
        # || exit 1: a bare loop answers with the last file's status alone,
        # so a failure in the middle would be reported as green
        run: for test in tests/*-js-smoke.js; do node "$test" || exit 1; done

      - name: Run concurrency smoke tests
        run: php tests/concurrency-smoke.php

  # The gate against a kernel change that breaks a feature: every feature of
  # the catalogue (dapeio/nino-features) is copied into this checkout and its
  # own tests run against it. The catalogue's CI does the reverse - runs its
  # features against Nino's main and latest tag - and records what passed
  features:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: phpstan:2.2.13

      - name: Fetch the feature catalogue
        run: git clone --depth 1 https://github.com/dapeio/nino-features.git ../nino-features

      # Only a feature whose "nino" condition this checkout satisfies is
      # copied: one that runs ahead of the kernel (a feature written for the
      # next minor) says so, is named here with its reason, and does not turn
      # main red. The same two calls, \Nino\Features::manifest() and
      # ::satisfies(), are what the kernel itself asks when it offers a feature
      - name: Copy the features this kernel can run
        run: |
          php -r '
            require "_nino/Nino.php";
            foreach( glob( "../nino-features/features/*", GLOB_ONLYDIR ) as $dir ) {
              $m = \Nino\Features::manifest( $dir );
              if( $m === null ) { fwrite( STDERR, "no manifest: ". basename( $dir ). "\n" ); exit( 1 ); }
              if( \Nino\Features::satisfies( $m["nino"] ) === false ) { echo "skipped on Nino ". \Nino\VERSION. ": ". $m["key"]. " needs ". $m["nino"]. "\n"; continue; }
              passthru( "cp -R ". escapeshellarg( $dir ). " features/", $status );
              if( $status !== 0 ) exit( 1 );
            }
          '

      - name: Validate every feature's manifest against this kernel
        run: |
          php -r '
            require "_nino/Nino.php";
            $a = []; $bad = 0;
            foreach( \Nino\Features::all( $a ) as $f ) {
              echo $f["key"], " ", $f["version"], $f["problems"] === [] ? "" : " - PROBLEMS: ". implode( "; ", $f["problems"] ), "\n";
              if( $f["problems"] !== [] ) $bad = 1;
            }
            exit( $bad );
          '

      - name: Run every feature's own smoke tests against this checkout
        run: for test in features/*/tests/*-smoke.php; do [ -e "$test" ] || continue; php "$test" || exit 1; done

      - name: Analyse the features with PHPStan
        run: phpstan analyse --no-progress --memory-limit=1G
